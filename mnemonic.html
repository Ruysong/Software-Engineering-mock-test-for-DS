<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>암기키 카드</title>
<style>
:root{--bg:#f5f2eb;--paper:#fffefa;--ink:#24231f;--muted:#77746b;--line:#e4dfd4;--accent:#7259d6;--soft:#eeeafd;--amber:#bd7b18}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Malgun Gothic",sans-serif}button,select{font:inherit;cursor:pointer}header{height:68px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 20px}.back{color:var(--accent);font-weight:800;text-decoration:none}.spacer{flex:1}select{border:1px solid var(--line);background:white;border-radius:9px;padding:9px}.wrap{max-width:820px;margin:30px auto;padding:0 16px}.status{display:flex;justify-content:space-between;color:var(--muted);margin-bottom:12px}.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:34px;box-shadow:0 15px 45px rgba(52,45,32,.1)}.num{color:var(--accent);font-weight:900}.badge{font-size:12px;color:var(--amber);background:#fff3dc;border-radius:20px;padding:5px 9px;margin-left:6px}.question{font-size:25px;font-weight:800;line-height:1.55;margin:28px 0}.panel{display:none;margin-top:16px;border-top:1px dashed var(--line);padding-top:16px}.panel.show{display:block}.panel h3{margin:0 0 8px;color:var(--accent)}.memory{font-size:23px;font-weight:900;line-height:1.55}.answer{font-size:18px;line-height:1.8}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:24px}.actions button,.nav button{border:1px solid var(--line);background:white;border-radius:12px;padding:13px;font-weight:800}.primary{grid-column:1/3;background:var(--ink)!important;color:white!important;border:0!important}.nav{display:flex;gap:8px;margin-top:12px}.nav button{flex:1}.keys{text-align:center;color:var(--muted);font-size:12px;margin-top:13px}@media(max-width:600px){header{height:auto;flex-wrap:wrap}select{width:100%}.card{padding:22px}.question{font-size:21px}.actions{grid-template-columns:1fr}.primary{grid-column:auto}}</style></head>
<body><header><a class="back" href="index.html">← 객관식</a><a class="back" href="recall.html">주관식 카드</a><strong>암기키 카드</strong><span class="spacer"></span><select id="week"></select></header><main class="wrap"><div id="app"></div></main>
<script src="mnemonic-data.js"></script><script>
const app=document.querySelector("#app"),week=document.querySelector("#week");let cards=MNEMONIC_CARDS,index=0,memo=false,answer=false;
const weeks=["전체",...new Set(MNEMONIC_CARDS.map(c=>c.week))];week.innerHTML=weeks.map(w=>`<option>${w}</option>`).join("");
function clean(text){return text.replace(/\*\\*/g,"").replace(/`/g,"")}
function render(){const c=cards[index];app.innerHTML=`<div class="status"><b>${c.week}</b><span>${index+1} / ${cards.length}</span></div><article class="card"><span class="num">CARD ${String(index+1).padStart(2,"0")}</span>${c.mnemonic?'<span class="badge">암기키 있음</span>':'<span class="badge">암기키 없음</span>'}<div class="question">${c.title}를 말하시오.</div><div class="panel ${memo?"show":""}"><h3>암기키</h3><div class="memory">${c.mnemonic||"이 카드는 암기키 없이 정답을 바로 회상합니다."}</div></div><div class="panel ${answer?"show":""}"><h3>정답</h3><div class="answer">${clean(c.answer).replaceAll(" | ","<br>")}</div></div><div class="actions"><button data-memo>암기키 보기</button><button data-answer>정답 보기</button><button class="primary" data-main>${answer?"다음 카드":memo?"정답 보기":"암기키 보기"}</button></div><div class="nav"><button data-prev>← 이전</button><button data-next>다음 →</button></div><div class="keys">Space 암기키/정답/다음 · M 암기키 · A 정답 · ←/→ 이동</div></article>`;document.querySelector("[data-memo]").onclick=()=>{memo=true;render()};document.querySelector("[data-answer]").onclick=()=>{memo=true;answer=true;render()};document.querySelector("[data-main]").onclick=mainAction;document.querySelector("[data-prev]").onclick=()=>move(-1);document.querySelector("[data-next]").onclick=()=>move(1)}
function mainAction(){if(answer)move(1);else if(memo){answer=true;render()}else{memo=true;render()}}
function move(d){index=(index+d+cards.length)%cards.length;memo=false;answer=false;render()}
week.onchange=()=>{cards=week.value==="전체"?MNEMONIC_CARDS:MNEMONIC_CARDS.filter(c=>c.week===week.value);index=0;memo=false;answer=false;render()};
document.addEventListener("keydown",e=>{if(e.key===" "){e.preventDefault();mainAction()}else if(e.key==="ArrowLeft"){move(-1)}else if(e.key==="ArrowRight"){move(1)}else if(e.key.toLowerCase()==="m"){memo=true;render()}else if(e.key.toLowerCase()==="a"){memo=true;answer=true;render()}});render();
</script></body></html>
