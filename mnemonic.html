<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>암기키 카드</title>
<style>
:root{--bg:#f5f2eb;--paper:#fffefa;--ink:#24231f;--muted:#77746b;--line:#e4dfd4;--accent:#7259d6;--soft:#eeeafd;--amber:#bd7b18}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Malgun Gothic",sans-serif}button,select{font:inherit;cursor:pointer}header{height:68px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 20px}.back{color:var(--accent);font-weight:800;text-decoration:none}.spacer{flex:1}select,.random-toggle,.star-filter{border:1px solid var(--line);background:white;border-radius:9px;padding:9px}.random-toggle.on,.star-filter.on{background:var(--accent);border-color:var(--accent);color:white}.wrap{max-width:820px;margin:30px auto;padding:0 16px}.status{display:flex;justify-content:space-between;color:var(--muted);margin-bottom:12px}.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:34px;box-shadow:0 15px 45px rgba(52,45,32,.1)}.num{color:var(--accent);font-weight:900}.star{float:right;border:0;background:transparent;color:#c9c5bb;font-size:30px;padding:0}.star.on{color:var(--amber)}.badge{font-size:12px;color:var(--amber);background:#fff3dc;border-radius:20px;padding:5px 9px;margin-left:6px}.question{font-size:25px;font-weight:800;line-height:1.55;margin:28px 0}.panel{display:none;margin-top:16px;border-top:1px dashed var(--line);padding-top:16px}.panel.show{display:block}.panel h3{margin:0 0 8px;color:var(--accent)}.memory{font-size:23px;font-weight:900;line-height:1.55}.memory strong,.answer strong{color:var(--accent);font-weight:950}.answer{font-size:18px;line-height:1.8}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:24px}.actions button,.nav button{border:1px solid var(--line);background:white;border-radius:12px;padding:13px;font-weight:800}.primary{grid-column:1/3;background:var(--ink)!important;color:white!important;border:0!important}.nav{display:flex;gap:8px;margin-top:12px}.nav button{flex:1}.keys{text-align:center;color:var(--muted);font-size:12px;margin-top:13px}@media(max-width:600px){header{height:auto;flex-wrap:wrap}select,.random-toggle,.star-filter{width:100%}.card{padding:22px}.question{font-size:21px}.actions{grid-template-columns:1fr}.primary{grid-column:auto}}</style></head>
<body><header><a class="back" href="index.html">← 객관식</a><a class="back" href="recall.html">주관식 카드</a><strong>암기키 카드</strong><span class="spacer"></span><select id="week"></select><button class="star-filter" id="starFilter">★ 별표 0</button><button class="random-toggle" id="randomBtn">랜덤 OFF</button></header><main class="wrap"><div id="app"></div></main>
<script src="mnemonic-data.js"></script><script>
const app=document.querySelector("#app"),week=document.querySelector("#week"),randomBtn=document.querySelector("#randomBtn"),starFilter=document.querySelector("#starFilter"),KEY="softwareEngineeringMnemonicStarsV1";let cards=MNEMONIC_CARDS,index=0,memo=false,answer=false,randomMode=false,randomQueue=[],starOnly=false,stars=loadStars();
const weeks=["전체",...new Set(MNEMONIC_CARDS.map(c=>c.week))];week.innerHTML=weeks.map(w=>`<option>${w}</option>`).join("");
function loadStars(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return {}}}
function saveStars(){localStorage.setItem(KEY,JSON.stringify(stars))}
function baseCards(){return week.value==="전체"?MNEMONIC_CARDS:MNEMONIC_CARDS.filter(c=>c.week===week.value)}
function applyFilter(){cards=baseCards().filter(c=>!starOnly||stars[c.title]);if(!cards.length){index=0;app.innerHTML='<article class="card">별표 카드가 없습니다.</article>';updateStarFilter();return}if(index>=cards.length)index=0;shuffle();render()}
function updateStarFilter(){starFilter.textContent=`★ 별표 ${baseCards().filter(c=>stars[c.title]).length}`;starFilter.classList.toggle("on",starOnly)}
function md(text){return text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")}
function render(){const c=cards[index];updateStarFilter();app.innerHTML=`<div class="status"><b>${c.week}</b><span>${starOnly?"별표 · ":""}${randomMode?"랜덤 · 남은 카드 "+randomQueue.length:index+1+" / "+cards.length}</span></div><article class="card"><button class="star ${stars[c.title]?"on":""}" data-star>★</button><span class="num">CARD ${String(index+1).padStart(2,"0")}</span>${c.mnemonic?'<span class="badge">암기키 있음</span>':'<span class="badge">암기키 없음</span>'}${randomMode?'<span class="badge">랜덤</span>':""}<div class="question">${c.title}를 말하시오.</div><div class="panel ${memo?"show":""}"><h3>암기키</h3><div class="memory">${c.mnemonic?md(c.mnemonic):"이 카드는 암기키 없이 정답을 바로 회상합니다."}</div></div><div class="panel ${answer?"show":""}"><h3>정답</h3><div class="answer">${md(c.answer).replaceAll(" | ","<br>")}</div></div><div class="actions"><button data-memo>암기키 보기</button><button data-answer>정답 보기</button><button class="primary" data-main>${answer?"다음 카드":memo?"정답 보기":"암기키 보기"}</button></div><div class="nav"><button data-prev>← 이전</button><button data-next>다음 →</button></div><div class="keys">Space 암기키/정답/다음 · R 랜덤 · F 별표 필터 · S 별표 · M 암기키 · A 정답</div></article>`;document.querySelector("[data-star]").onclick=toggleStar;document.querySelector("[data-memo]").onclick=()=>{memo=true;render()};document.querySelector("[data-answer]").onclick=()=>{memo=true;answer=true;render()};document.querySelector("[data-main]").onclick=mainAction;document.querySelector("[data-prev]").onclick=()=>move(-1);document.querySelector("[data-next]").onclick=()=>move(1)}
function mainAction(){if(answer)move(1);else if(memo){answer=true;render()}else{memo=true;render()}}
function shuffle(){randomQueue=[...cards.keys()].filter(i=>i!==index).sort(()=>Math.random()-.5)}
function move(d){if(randomMode&&d>0){if(!randomQueue.length)shuffle();index=randomQueue.shift()??index}else index=(index+d+cards.length)%cards.length;memo=false;answer=false;render()}
function setRandom(on){randomMode=on;randomBtn.classList.toggle("on",randomMode);randomBtn.textContent=randomMode?"랜덤 ON":"랜덤 OFF";shuffle();render()}
randomBtn.onclick=()=>setRandom(!randomMode);
function toggleStar(){const c=cards[index];if(!c)return;stars[c.title]?delete stars[c.title]:stars[c.title]=true;saveStars();if(starOnly&&!stars[c.title])applyFilter();else render()}
function toggleStarFilter(){starOnly=!starOnly;index=0;memo=false;answer=false;applyFilter()}
week.onchange=()=>{index=0;memo=false;answer=false;applyFilter()};
starFilter.onclick=toggleStarFilter;
document.addEventListener("keydown",e=>{if(e.key===" "){e.preventDefault();mainAction()}else if(e.key==="ArrowLeft"){move(-1)}else if(e.key==="ArrowRight"){move(1)}else if(e.key.toLowerCase()==="m"){memo=true;render()}else if(e.key.toLowerCase()==="a"){memo=true;answer=true;render()}else if(e.key.toLowerCase()==="r"){setRandom(!randomMode)}else if(e.key.toLowerCase()==="s"){toggleStar()}else if(e.key.toLowerCase()==="f"){toggleStarFilter()}});applyFilter();
</script></body></html>
