<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중요도 암기 카드</title>
<style>
:root{--bg:#0e1116;--panel:#161b24;--panel2:#1d2530;--edge:#2a3340;--text:#e8ebf0;--dim:#8b95a5;--hot:#ff5e3a;--warm:#ffb02e;--cool:#3dd7b8;--ice:#5b8def}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"Malgun Gothic",sans-serif}button,select{font:inherit;cursor:pointer}header{height:68px;border-bottom:1px solid var(--edge);background:#111722;display:flex;align-items:center;gap:12px;padding:12px 20px}.back{color:var(--warm);font-weight:800;text-decoration:none}.spacer{flex:1}select{background:var(--panel);color:var(--text);border:1px solid var(--edge);border-radius:9px;padding:9px}.wrap{max-width:860px;margin:28px auto;padding:0 16px}.status{display:flex;justify-content:space-between;color:var(--dim);margin-bottom:12px}.card{background:var(--panel);border:1px solid var(--edge);border-radius:22px;padding:32px;box-shadow:0 18px 50px rgba(0,0,0,.22)}.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.num{font-weight:900;color:var(--warm)}.badge{font-size:12px;border-radius:999px;padding:5px 9px;background:var(--panel2);color:var(--dim)}.tier5{color:var(--hot)}.tier4{color:var(--warm)}.tier3{color:var(--cool)}.tier2{color:var(--ice)}.question{font-size:27px;font-weight:850;line-height:1.45;margin:28px 0 18px;word-break:keep-all}.why{color:var(--dim);line-height:1.7;border-left:4px solid var(--edge);padding-left:14px}.hint-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.hint{border:1px solid var(--edge);background:var(--panel2);color:var(--text);border-radius:10px;padding:10px 12px}.answer{display:none;margin-top:24px;border-top:1px dashed var(--edge);padding-top:20px}.answer.show{display:block}.answer strong{color:var(--warm)}.answer-text{font-size:20px;line-height:1.7;margin-top:10px}.km{color:var(--cool);font-weight:800}.show{width:100%;border:0;background:linear-gradient(120deg,var(--hot),var(--warm));color:#111;border-radius:12px;padding:14px;margin-top:24px;font-weight:900}.nav{display:flex;gap:8px;margin-top:12px}.nav button{flex:1;background:var(--panel2);border:1px solid var(--edge);color:var(--text);border-radius:11px;padding:12px}.keys{text-align:center;color:var(--dim);font-size:12px;margin-top:13px}@media(max-width:650px){header{height:auto;flex-wrap:wrap}select{width:100%}.card{padding:22px}.question{font-size:22px}}</style></head>
<body><header><a class="back" href="index.html">← 객관식</a><a class="back" href="recall.html">주관식 카드</a><strong>중요도 암기 카드</strong><span class="spacer"></span><select id="unit"></select><select id="tier"></select></header><main class="wrap"><div id="app"></div></main>
<script src="importance-data.js"></script><script>
const tierName={5:"최상",4:"상",3:"중",2:"참고"},typeName={list:"나열형",seq:"순서형",comp:"비교형",concept:"개념·서술"};
const app=document.querySelector("#app"),unitSel=document.querySelector("#unit"),tierSel=document.querySelector("#tier");let all=[],cards=[],index=0,revealed=false,keywordHint=false;
IMPORTANCE_UNITS.forEach(u=>u.topics.forEach(t=>all.push({...t,unit:`${u.no} ${u.title}`})));
unitSel.innerHTML=["전체",...new Set(all.map(c=>c.unit))].map(x=>`<option>${x}</option>`).join("");tierSel.innerHTML=`<option value="all">전체 중요도</option><option value="5">최상만</option><option value="4">상 이상</option><option value="3">중 이상</option>`;
function filtered(){cards=all.filter(c=>(unitSel.value==="전체"||c.unit===unitSel.value)&&(tierSel.value==="all"||c.tier>=Number(tierSel.value))).sort((a,b)=>b.tier-a.tier);index=0;revealed=false;keywordHint=false;render()}
function render(){const c=cards[index];if(!c){app.innerHTML='<article class="card">카드가 없습니다.</article>';return}app.innerHTML=`<div class="status"><b>${c.unit}</b><span>${index+1} / ${cards.length}</span></div><article class="card"><div class="top"><span class="num">CARD ${String(index+1).padStart(2,"0")}</span><span class="badge tier${c.tier}">중요도 ${tierName[c.tier]} · ${c.tier}/5</span><span class="badge">${typeName[c.type]}</span>${c.type==="seq"?'<span class="badge tier2">순서 중요</span>':""}</div><div class="question">${question(c)}</div><div class="why">${c.why}</div><div class="hint-row">${c.km?`<button class="hint" data-keyword>${keywordHint?`키워드: ${c.km}`:"키워드 힌트"}</button>`:""}</div><div class="answer ${revealed?"show":""}"><strong>정답 포인트</strong><div class="answer-text">${c.ans}</div>${c.km?`<div class="km">암기키: ${c.km}</div>`:""}</div><button class="show">${revealed?"다음 카드":"정답 보기"}</button><div class="nav"><button data-prev>← 이전</button><button data-next>다음 →</button></div><div class="keys">Space 정답 보기/다음 · K 키워드 힌트 · ←/→ 카드 이동</div></article>`;document.querySelector("[data-keyword]")?.addEventListener("click",()=>{keywordHint=true;render()});document.querySelector(".show").onclick=()=>revealed?move(1):(revealed=true,render());document.querySelector("[data-prev]").onclick=()=>move(-1);document.querySelector("[data-next]").onclick=()=>move(1)}
function question(c){if(c.type==="seq")return `${c.name}를 순서대로 말하시오.`;if(c.type==="comp")return `${c.name}의 차이를 설명하시오.`;if(c.type==="list")return `${c.name}를 말하시오.`;return `${c.name}의 핵심을 설명하시오.`}
function move(d){index=(index+d+cards.length)%cards.length;revealed=false;keywordHint=false;render()}
unitSel.onchange=filtered;tierSel.onchange=filtered;document.addEventListener("keydown",e=>{if(e.key===" "){e.preventDefault();revealed?move(1):(revealed=true,render())}else if(e.key==="ArrowLeft"){move(-1)}else if(e.key==="ArrowRight"){move(1)}else if(e.key.toLowerCase()==="k"){keywordHint=true;render()}});filtered();
</script></body></html>
