<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>주관식 암기 카드</title>
<style>
:root{--bg:#f5f2eb;--paper:#fffefa;--ink:#24231f;--muted:#77746b;--line:#e4dfd4;--accent:#7259d6;--soft:#eeeafd;--green:#26875a;--amber:#bd7b18}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Malgun Gothic",sans-serif}button,select{font:inherit;cursor:pointer}header{height:68px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 20px}.back{color:var(--accent);font-weight:700;text-decoration:none}.spacer{flex:1}select{border:1px solid var(--line);background:white;border-radius:9px;padding:9px}.wrap{max-width:820px;margin:30px auto;padding:0 16px}.status{display:flex;justify-content:space-between;color:var(--muted);margin-bottom:12px}.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:34px;box-shadow:0 15px 45px rgba(52,45,32,.1)}.top{display:flex;align-items:center;gap:8px}.num{color:var(--accent);font-weight:800}.badge{font-size:12px;color:var(--amber);background:#fff3dc;border-radius:20px;padding:5px 9px}.question{font-size:25px;font-weight:750;line-height:1.55;margin:28px 0}.hints{display:flex;gap:9px;flex-wrap:wrap}.hint{background:var(--soft);color:var(--accent);border-radius:10px;padding:9px 12px;font-weight:700}.answer{display:none;margin-top:25px;border-top:1px dashed var(--line);padding-top:20px}.answer.show{display:block}.answer ol,.answer ul{margin:0;padding-left:25px;display:grid;gap:10px;font-size:18px;line-height:1.5}.show{width:100%;border:0;background:var(--ink);color:white;border-radius:12px;padding:14px;margin-top:25px;font-weight:800}.nav{display:flex;gap:8px;margin-top:12px}.nav button{flex:1;border:1px solid var(--line);background:white;border-radius:11px;padding:12px}.keys{text-align:center;color:var(--muted);font-size:12px;margin-top:13px}@media(max-width:600px){header{height:auto;flex-wrap:wrap}select{width:100%}.card{padding:22px}.question{font-size:20px}}</style></head>
<body><header><a class="back" href="index.html">← 객관식으로</a><a class="back" href="ox.html">OX 퀴즈</a><strong>주관식 암기 카드</strong><span class="spacer"></span><select id="week"></select></header><main class="wrap"><div id="app"></div></main>
<script src="recall-data.js"></script><script>
const app=document.querySelector("#app"),week=document.querySelector("#week");let cards=RECALL_CARDS,index=0,revealed=false,countHint=false,initialHint=false;
const weeks=["전체",...new Set(RECALL_CARDS.map(c=>c.week))];week.innerHTML=weeks.map(w=>`<option>${w}</option>`).join("");
function initials(a){return a.map(x=>x.trim()[0].toUpperCase()).join(" / ")}
function render(){const c=cards[index];app.innerHTML=`<div class="status"><b>${c.week}</b><span>${index+1} / ${cards.length}</span></div><article class="card"><div class="top"><span class="num">CARD ${String(index+1).padStart(2,"0")}</span>${c.ordered?'<span class="badge">순서 중요</span>':""}</div><div class="question">${c.q}</div><div class="hints"><button class="hint" data-count>${countHint?`총 ${c.a.length}가지`:"개수 힌트"}</button><button class="hint" data-initial>${initialHint?`첫 글자: ${initials(c.a)}`:"첫 글자 힌트"}</button></div><div class="answer ${revealed?"show":""}"><strong>정답</strong><${c.ordered?"ol":"ul"}>${c.a.map(x=>`<li>${x}</li>`).join("")}</${c.ordered?"ol":"ul"}></div><button class="show">${revealed?"다음 카드":"정답 보기"}</button><div class="nav"><button data-prev>← 이전</button><button data-next>다음 →</button></div><div class="keys">Space 정답 보기/다음 · ←/→ 카드 이동</div></article>`;document.querySelector("[data-count]").onclick=()=>{countHint=true;render()};document.querySelector("[data-initial]").onclick=()=>{initialHint=true;render()};document.querySelector(".show").onclick=()=>revealed?move(1):(revealed=true,render());document.querySelector("[data-prev]").onclick=()=>move(-1);document.querySelector("[data-next]").onclick=()=>move(1)}
function move(d){index=(index+d+cards.length)%cards.length;revealed=false;countHint=false;initialHint=false;render()}
week.onchange=()=>{cards=week.value==="전체"?RECALL_CARDS:RECALL_CARDS.filter(c=>c.week===week.value);index=0;revealed=false;countHint=false;initialHint=false;render()};
document.addEventListener("keydown",e=>{if(e.key===" "){e.preventDefault();revealed?move(1):(revealed=true,render())}else if(e.key==="ArrowLeft"){e.preventDefault();move(-1)}else if(e.key==="ArrowRight"){e.preventDefault();move(1)}});render();
</script></body></html>
